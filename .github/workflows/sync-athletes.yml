name: Sync Athlete Data

on:
  schedule:
    # Runs every day at 6am UTC (2am ET)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch all athletes (ignore existing results)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync current season results
        run: node scripts/sync-athlete-results.js --debug ${{ inputs.force == true && '--force' || '' }}

      - name: Sync historical results
        run: node scripts/sync-history.js ${{ inputs.force == true && '--force' || '' }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add running-site/_data/athletes/ running-site/_data/athletes.json
          git diff --staged --quiet || git commit -m "chore: sync athlete data from World Athletics"
          git pull --rebase
          git push
